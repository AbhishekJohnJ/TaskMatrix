version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: taskmatrix-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: taskmatrix
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - taskflow-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskmatrix-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/taskmatrix?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production_32_chars_min
      JWT_REFRESH_SECRET: your_super_secret_jwt_refresh_key_change_this_in_production_32_chars_min
      JWT_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 7d
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - taskmatrix-network
    volumes:
      - ./server:/app
      - /app/node_modules

  # Frontend Application
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taskmatrix-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - taskmatrix-network
    volumes:
      - ./client:/app
      - /app/node_modules

networks:
  taskmatrix-network:
    driver: bridge

volumes:
  mongodb_data:
